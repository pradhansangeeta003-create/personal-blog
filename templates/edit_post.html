<!DOCTYPE html>
<html>

<head>
    <title>Edit Post - My Personal Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>My Personal Blog</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/blog">Blog</a>
            <a href="/create-post">Create Post</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main>

        <h2>Edit Blog Post</h2>

        <form method="POST">

            <label>Post Title</label>
            <br>

            <input type="text"
                   name="title"
                   value="{{ post['title'] }}"
                   required>

            <br><br>

            <label>Content</label>
            <br>

            <textarea name="content"
                      rows="10"
                      cols="50"
                      required>{{ post['content'] }}</textarea>

            <br><br>

            <button type="submit">Update Post</button>

        </form>

    </main>

</body>

</html>
